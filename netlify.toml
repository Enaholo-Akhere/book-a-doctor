# Netlify needs its Next.js runtime to serve the app (pages, dynamic routes,
# rewrites). Without it, the raw .next folder is published as static files
# and every URL returns 404. Declared explicitly so it never depends on
# auto-detection.
# The /api/v1 proxy lives in next.config.ts (rewrites).
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
